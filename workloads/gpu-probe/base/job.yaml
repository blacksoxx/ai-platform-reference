# One GPU, one container, print and exit. The image is images/gpu-probe in this repository.
# A Job's pod template is immutable, so Argo CD replaces the Job when it changes.
apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-probe
  namespace: workloads
  labels:
    app.kubernetes.io/name: gpu-probe
    app.kubernetes.io/part-of: ai-platform
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 2
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gpu-probe
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000 # the image's "ubuntu" user, by number so the kubelet can check it
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      # GPU nodes are tainted ai-platform.io/gpu=<vendor>:NoSchedule; GPU workloads tolerate it.
      tolerations:
        - key: ai-platform.io/gpu
          operator: Exists
          effect: NoSchedule
      containers:
        - name: probe
          image: ghcr.io/blacksoxx/ai-platform-reference/gpu-probe:main
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
              nvidia.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
