# ci: a simulated GPU on a kind worker. The image is built by clusters/ci/bootstrap.sh and
# loaded into the nodes with the :dev tag, so no registry is involved.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workloads
resources:
  - ../../base
images:
  - name: ghcr.io/blacksoxx/ai-platform-reference/gpu-probe
    newTag: dev
patches:
  - target:
      kind: Job
      name: gpu-probe
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          ai-platform.io/gpu: nvidia
      - op: add
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
