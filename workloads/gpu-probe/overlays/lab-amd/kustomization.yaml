# lab, AMD: the Ryzen AI Max+ box (amd64). Same image, the AMD resource instead of NVIDIA's.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workloads
resources:
  - ../../base
patches:
  - target:
      kind: Job
      name: gpu-probe
    patch: |-
      - op: replace
        path: /metadata/name
        value: gpu-probe-amd
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          ai-platform.io/gpu: amd
      - op: remove
        path: /spec/template/spec/containers/0/resources/limits/nvidia.com~1gpu
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/amd.com~1gpu
        value: 1
