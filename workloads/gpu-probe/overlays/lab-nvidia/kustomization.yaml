# lab, NVIDIA: the DGX Spark (arm64). Image from the registry, built multi-arch by CI.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: workloads
resources:
  - ../../base
patches:
  - target:
      kind: Job
      name: gpu-probe
    patch: |-
      - op: replace
        path: /metadata/name
        value: gpu-probe-nvidia
      - op: add
        path: /spec/template/spec/nodeSelector
        value:
          ai-platform.io/gpu: nvidia
