# GPU alerts. Metric names are dcgm-exporter's (NVIDIA) and kube-state-metrics'; the AMD
# exporter's equivalents are added once the Halo is in the lab cluster.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gpu
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: ai-platform
spec:
  groups:
    - name: gpu.nodes
      rules:
        - alert: GPUNodeNotReady
          # A node that advertises GPUs and is not Ready. kube-state-metrics exposes capacity per
          # extended resource with the resource name sanitised (nvidia_com_gpu, amd_com_gpu).
          expr: |
            (kube_node_status_capacity{resource=~"nvidia_com_gpu|amd_com_gpu"} > 0)
              and on (node)
            (kube_node_status_condition{condition="Ready", status="true"} == 0)
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "GPU node {{ $labels.node }} is NotReady"
            description: >-
              Node {{ $labels.node }} advertises {{ $labels.resource }} and has not been Ready for
              5 minutes. Its GPU workloads cannot run.
            runbook_url: https://github.com/blacksoxx/ai-platform-reference/blob/main/docs/runbooks/gpu-node-not-ready.md

    - name: gpu.health
      rules:
        - alert: GPUXidError
          # DCGM_FI_DEV_XID_ERRORS holds the last XID error code seen by the driver; non-zero means
          # the GPU reported a fault (ECC, fallen off the bus, illegal access, ...).
          expr: DCGM_FI_DEV_XID_ERRORS > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "XID error {{ $value }} on GPU {{ $labels.gpu }} of {{ $labels.Hostname }}"
            description: >-
              The NVIDIA driver on {{ $labels.Hostname }} reported XID {{ $value }} for GPU
              {{ $labels.gpu }} ({{ $labels.modelName }}).
            runbook_url: https://github.com/blacksoxx/ai-platform-reference/blob/main/docs/runbooks/gpu-xid-error.md

        - alert: GPUTemperatureHigh
          expr: DCGM_FI_DEV_GPU_TEMP > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} at {{ $value }}°C"
            description: "GPU temperature above 85°C for 5 minutes on {{ $labels.Hostname }}; thermal throttling and then shutdown follow."
            runbook_url: https://github.com/blacksoxx/ai-platform-reference/blob/main/docs/runbooks/gpu-temperature-high.md

    - name: gpu.utilisation
      rules:
        - alert: GPUAllocatedButIdle
          # A GPU with a pod attached but no utilisation for 30 minutes: a notebook left open,
          # a hung job, or a process that never started. Quota is spent for nothing.
          expr: |
            (DCGM_FI_DEV_GPU_UTIL{pod!=""} == 0)
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} is allocated to {{ $labels.namespace }}/{{ $labels.pod }} but idle"
            description: "No utilisation for 30 minutes while allocated. Check whether the workload is stuck or forgotten."
            runbook_url: https://github.com/blacksoxx/ai-platform-reference/blob/main/docs/runbooks/gpu-allocated-but-idle.md
