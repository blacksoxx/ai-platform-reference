# Alert rules as PrometheusRule resources, picked up by the platform Prometheus (it selects every
# PrometheusRule in the cluster). Every alert carries a runbook_url into docs/runbooks/.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - gpu.yaml
  - inference.yaml
  - scheduling.yaml
  - security.yaml
