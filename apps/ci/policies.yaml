# Wave 3: admission policies, once Kyverno (wave 0) is serving its webhooks.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: policies
  annotations:
    argocd.argoproj.io/sync-wave: "3"
spec:
  project: default
  source:
    path: policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
