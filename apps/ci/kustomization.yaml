# App of apps for the ci environment. The root Application (clusters/ci/root-app.yaml) points
# here; every file below is one Argo CD Application for one component, ordered by sync wave.
# Argo CD applies wave N and waits for it to be Healthy before starting wave N+1.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
resources:
  # wave -1: CRDs other components depend on
  - prometheus-operator-crds.yaml
  # wave 0: operators and core services
  - argocd.yaml
  - cilium.yaml
  - cert-manager.yaml
  - vault.yaml
  - fake-gpu-operator.yaml
  # wave 1: needs Vault configured
  - external-secrets.yaml
  # wave 2: needs External Secrets and the platform CA
  - kube-prometheus-stack.yaml
  - gateway.yaml
  - otel-collector.yaml
  - dashboards.yaml
  - alerts.yaml
  # wave 4: workloads
  - workload-gpu-probe.yaml
patches:
  # Every Application tracks this repository and branch; set once here instead of in each file.
  - target:
      kind: Application
    patch: |-
      - op: add
        path: /spec/source/repoURL
        value: https://github.com/blacksoxx/ai-platform-reference.git
      - op: add
        path: /spec/source/targetRevision
        value: main
