# CRDs first: ServiceMonitor, PodMonitor and PrometheusRule must exist before any component in
# wave 0 ships one. The CRDs are large; ServerSideApply keeps them under the annotation limit.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crds
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    path: platform/prometheus-operator-crds/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
