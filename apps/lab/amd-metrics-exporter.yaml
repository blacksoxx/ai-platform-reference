apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: amd-metrics-exporter
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    path: platform/amd-metrics-exporter/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: amd-gpu
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
