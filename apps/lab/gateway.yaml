# Wave 2: the Gateway's certificate needs the platform-ca ClusterIssuer from wave 0.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    path: platform/gateway/overlays/lab
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
