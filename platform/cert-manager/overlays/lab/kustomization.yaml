apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - ../../base
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.3 # checked 2026-11-09
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml
