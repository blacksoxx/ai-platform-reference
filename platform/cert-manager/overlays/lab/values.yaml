# lab: control-plane placement so the controllers never land on a GPU node.
global:
  nodeSelector:
    node-role.kubernetes.io/control-plane: "true"
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
