# cert-manager: X.509 certificates as Kubernetes resources. The chart is declared per overlay;
# this base holds the namespace, the shared values and the issuer chain every environment uses:
# a self-signed root, a CA certificate signed by it, and the "platform-ca" ClusterIssuer that
# every Gateway listener and internal service certificate refers to.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - cluster-issuers.yaml
