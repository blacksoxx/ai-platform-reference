# ci: small requests on a kind cluster, a CPU cap so the probe cannot starve the nodes, and
# workers only: the control-plane node keeps its CPU for the API server and the controllers.
nodeSelector:
  ai-platform.io/gpu: nvidia
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi
falcosidekick:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi
