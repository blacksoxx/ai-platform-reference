# Configures the dev-mode Vault after every sync of this Application: Kubernetes auth, the KV v2
# engine, the External Secrets policy and role, and the seed secrets the platform expects.
# Dev mode keeps everything in memory, so the Job is idempotent and re-runs on each sync
# (Argo CD Sync hook, recreated before each run).
#
# Commands from the Vault docs, Kubernetes auth method, "Configuration":
#   vault auth enable kubernetes
#   vault write auth/kubernetes/config kubernetes_host=https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT
#     ("Use local service account token as the reviewer JWT": omit token_reviewer_jwt and kubernetes_ca_cert)
#   vault write auth/kubernetes/role/<name> bound_service_account_names=... bound_service_account_namespaces=...
#     policies=... audience=... ttl=...
# https://developer.hashicorp.com/vault/docs/auth/kubernetes
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-configure
  namespace: vault
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault-configure
        app.kubernetes.io/part-of: ai-platform
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 100 # the "vault" user of the image
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: configure
          # Same image and tag as the chart's server (values: server.image hashicorp/vault:2.0.4).
          image: hashicorp/vault:2.0.4
          env:
            - name: VAULT_ADDR
              value: http://vault.vault.svc:8200
            - name: VAULT_TOKEN
              value: root # the dev root token from values.yaml; ci only
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          command: [/bin/sh, -ec]
          args:
            - |
              echo "waiting for vault"
              until vault status >/dev/null 2>&1; do sleep 2; done

              echo "kubernetes auth"
              vault auth list -format=json | grep -q '"kubernetes/"' || vault auth enable kubernetes
              vault write auth/kubernetes/config \
                kubernetes_host="https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT"

              echo "kv-v2 engine at platform/"
              vault secrets list -format=json | grep -q '"platform/"' || vault secrets enable -path=platform kv-v2

              echo "policy and role for external-secrets"
              vault policy write external-secrets - <<'HCL'
              path "platform/data/*"     { capabilities = ["read"] }
              path "platform/metadata/*" { capabilities = ["read", "list"] }
              HCL
              vault write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=external-secrets \
                audience=vault \
                ttl=1h

              echo "seed secrets (only when absent)"
              vault kv get platform/grafana >/dev/null 2>&1 || vault kv put platform/grafana \
                admin-user=admin \
                admin-password="$(head -c 24 /dev/urandom | base64 | tr -d '/+=' | head -c 24)"

              echo "done"
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              memory: 128Mi
