apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault
resources:
  - ../../base
helmCharts:
  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.34.1 # Vault 2.0.4, checked 2026-11-09
    releaseName: vault
    namespace: vault
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml
