apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kyverno
resources:
  - ../../base
helmCharts:
  - name: kyverno
    repo: https://kyverno.github.io/kyverno
    version: 3.9.2 # Kyverno v1.19.2, checked 2026-11-09
    releaseName: kyverno
    namespace: kyverno
    includeCRDs: true
    valuesFile: ../../base/values.yaml
    additionalValuesFiles:
      - values.yaml
