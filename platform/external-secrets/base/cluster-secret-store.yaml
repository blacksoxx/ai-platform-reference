# The one store every ExternalSecret points at. Vault in-cluster, KV version 2 engine mounted
# at "platform", Kubernetes auth with the operator's own service account.
# ESO docs, HashiCorp Vault provider: server, path, version "v2", auth.kubernetes with mountPath,
# role and serviceAccountRef; "In case of a ClusterSecretStore, Be sure to provide namespace in
# serviceAccountRef". https://external-secrets.io/latest/provider/hashicorp-vault/
# The Vault side (auth method, role, policy, engine) is created by platform/vault.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    vault:
      server: http://vault.vault.svc:8200
      path: platform
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            # Token audience, matched by the "audience" of the Vault role (platform/vault).
            audiences:
              - vault
