# Grafana through the platform Gateway. Gateway API HTTPRoute: parentRefs to the shared Gateway,
# hostname on nip.io so the address resolves without any DNS setup, backend the chart's Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
  hostnames:
    - grafana.172-18-255-10.nip.io
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
