# ci: short retention, one replica, small requests; nothing persists across cluster recreation.
prometheus:
  prometheusSpec:
    retention: 2d
    # Half the default scrape rate: the kind nodes are shared by the whole platform.
    scrapeInterval: 30s
    evaluationInterval: 30s
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        memory: 1536Mi

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi

grafana:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Behind the Gateway on this hostname (platform/gateway); Grafana needs it for redirects.
  grafana.ini:
    server:
      root_url: https://grafana.172-18-255-10.nip.io

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # The chart's one-second probe timeout killed the operator while the node was busy with the
  # first scans and downloads; it needs a minute to connect and list its CRDs under load.
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
    initialDelaySeconds: 60
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
    initialDelaySeconds: 20

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 256Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 128Mi
