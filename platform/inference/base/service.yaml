# The one front door for inference. It selects every backend by the shared name label, so a
# request may be answered by vLLM on the NVIDIA node or by llama.cpp on the AMD node; both
# serve the model as "ai-platform" and answer the same OpenAI-compatible API on port 8000.
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: inference
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/part-of: ai-platform
spec:
  selector:
    app.kubernetes.io/name: inference
  ports:
    - name: http
      port: 8000
      targetPort: http
