# llama.cpp with ROCm on the Ryzen AI Max+ box. AMD's Radeon and Ryzen documentation lists the
# Ryzen AI Max 300 series as supported on Linux with PyTorch only; llama.cpp with HIP runs on
# it through community builds, which is why the AMD side serves with llama.cpp and not vLLM.
# ghcr.io/ggml-org/llama.cpp:server-rocm (linux/amd64, pinned digest, 2026-11-09). The device
# plugin mounts /dev/kfd and the render node for the amd.com/gpu request.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference-amd
  namespace: inference
  labels:
    app.kubernetes.io/name: inference
    app.kubernetes.io/component: amd
    app.kubernetes.io/part-of: ai-platform
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
      app.kubernetes.io/component: amd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: inference
        app.kubernetes.io/component: amd
        ai-platform.io/backend: llama.cpp-rocm
    spec:
      nodeSelector:
        ai-platform.io/gpu: amd
      tolerations:
        - key: ai-platform.io/gpu
          operator: Equal
          value: amd
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        # Access to the render node: the video and render groups of the host (Ubuntu: 44, 992
        # by default); verify on the node with `getent group video render`.
        supplementalGroups: [44, 992]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/ggml-org/llama.cpp:server-rocm@sha256:cce1324adc651a50f9c9edc1f261a927c4011c5d3663385ac778a895b36f4e41
          env:
            # Qwen/Qwen2.5-7B-Instruct-GGUF (Apache-2.0), q4_k_m, about 4.7 GB in two shards;
            # repository revision bb5d59e06d95 on 2026-11-09.
            - name: LLAMA_ARG_HF_REPO
              value: Qwen/Qwen2.5-7B-Instruct-GGUF:Q4_K_M
            - name: LLAMA_ARG_N_GPU_LAYERS
              value: all
            - name: LLAMA_ARG_HOST
              value: 0.0.0.0
            - name: LLAMA_ARG_PORT
              value: "8000"
            - name: LLAMA_ARG_ALIAS
              value: ai-platform
            - name: LLAMA_ARG_CTX_SIZE
              value: "8192"
            - name: LLAMA_ARG_ENDPOINT_METRICS
              value: "1"
            - name: LLAMA_CACHE
              value: /cache
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 15
            failureThreshold: 120
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: "2"
              memory: 8Gi
            limits:
              memory: 24Gi
              amd.com/gpu: 1
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: cache
          emptyDir:
            sizeLimit: 20Gi
        - name: tmp
          emptyDir: {}
