# ci: cluster name for the reports, small requests and hard CPU caps on a kind cluster whose
# nodes are shared by the whole platform. The posture scan is what the ci proof checks; image
# vulnerability scanning (Trivy covers it) and the node scan stay off here because their first
# run saturated the nodes. The node agent stays off the control-plane node.
clusterName: ai-platform-ci

capabilities:
  nodeScan: disable
  nodeSbomGeneration: disable
  vulnerabilityScan: disable

kubescape:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 1Gi
kubevuln:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 300m
      memory: 2Gi
nodeAgent:
  nodeSelector:
    ai-platform.io/gpu: nvidia
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
operator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
storage:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 300m
      memory: 1Gi
