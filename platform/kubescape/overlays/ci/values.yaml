# ci: cluster name for the reports and small requests on a kind cluster. The posture scan is
# what the ci proof checks; image vulnerability scanning (Trivy covers it) and the node scan
# stay off here because their first run saturated the shared kind nodes.
clusterName: ai-platform-ci

capabilities:
  nodeScan: disable
  nodeSbomGeneration: disable
  vulnerabilityScan: disable

kubescape:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
kubevuln:
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
nodeAgent:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
operator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
storage:
  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      memory: 1Gi
