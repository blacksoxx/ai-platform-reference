# ci: a kind cluster on a laptop or a GitHub runner. One replica of everything, small requests,
# and short reconciliation so end-to-end tests do not wait on timers.
global:
  domain: argocd.ci.ai-platform.local

configs:
  cm:
    # Default is 180s; a pushed commit is picked up within two minutes, which is short enough
    # for the e2e loop and cheap enough for the application controller on a shared node.
    timeout.reconciliation: 120s
  params:
    # One manifest generation at a time: rendering a dozen Helm charts in parallel on a small
    # node starved the repo-server's own health endpoint.
    reposerver.parallelism.limit: 1

controller:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      memory: 1Gi

repoServer:
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      memory: 1Gi
  # A kind node shared by the whole platform is slow while scanners and model downloads run;
  # the chart's one-second probe timeout killed a healthy repo-server every few minutes.
  readinessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
    initialDelaySeconds: 30
  livenessProbe:
    timeoutSeconds: 10
    failureThreshold: 6
    initialDelaySeconds: 60

server:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

applicationSet:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

redis:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
