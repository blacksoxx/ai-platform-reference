# ci: one scan job at a time and small requests for the operator and for each scan job; the
# kind nodes are shared by the whole platform.
operator:
  scanJobsConcurrentLimit: 1
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
trivy:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
