apiVersion: v1
kind: Namespace
metadata:
  name: trivy-system
  labels:
    app.kubernetes.io/part-of: ai-platform
    # The scan Jobs the operator spawns run with their own defaults; baseline is enforced and
    # restricted violations are reported. The operator itself meets restricted (values.yaml).
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
