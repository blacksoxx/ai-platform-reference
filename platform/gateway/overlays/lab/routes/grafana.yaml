# Grafana through the platform Gateway. Gateway API HTTPRoute: parentRefs to the shared Gateway,
# hostname on lab.ai-platform.local, resolved by the lab DNS or /etc/hosts, backend the chart's Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2" # after the Gateway (wave 1) that must accept the route
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
  hostnames:
    - grafana.lab.ai-platform.local
  rules:
    - backendRefs:
        - name: monitoring-grafana
          port: 80
