# The inference endpoint through the platform Gateway: one hostname, one Service, any backend.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: inference
  namespace: inference
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2" # after the Gateway (wave 1) that must accept the route
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
  hostnames:
    - inference.lab.ai-platform.local
  rules:
    - backendRefs:
        - name: inference
          port: 8000
