# The shared Gateway for lab. The address comes from the lab LoadBalancer pool (platform/cilium
# lab overlay); hostnames under lab.ai-platform.local are resolved by the operator's DNS or
# /etc/hosts, see docs/setup-lab.md.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: platform
  namespace: platform-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  gatewayClassName: cilium
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.lab.ai-platform.local"
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: platform-gateway-tls
      allowedRoutes:
        namespaces:
          from: All
