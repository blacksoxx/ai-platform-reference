# Argo CD UI and API. The server runs with server.insecure, so
# the Gateway terminates TLS and talks plain HTTP to the Service's port 80.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2" # after the Gateway (wave 1) that must accept the route
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
  hostnames:
    - argocd.172-18-255-10.nip.io
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
