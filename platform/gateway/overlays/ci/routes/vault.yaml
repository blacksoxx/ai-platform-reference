# Vault's UI and API through the platform Gateway (ci only; dev mode).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2" # after the Gateway (wave 1) that must accept the route
spec:
  parentRefs:
    - name: platform
      namespace: platform-gateway
  hostnames:
    - vault.172-18-255-10.nip.io
  rules:
    - backendRefs:
        - name: vault
          port: 8200
