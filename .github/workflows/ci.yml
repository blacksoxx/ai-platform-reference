name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUSTOMIZE_VERSION: 5.8.3
  KUBECONFORM_VERSION: 0.8.0
  KYVERNO_VERSION: 1.19.2
  YAMLLINT_VERSION: 1.38.0

jobs:
  lint:
    name: lint (kustomize, kubeconform, yamllint, kyverno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned tools
        run: |
          set -eu
          gh="https://github.com"
          curl -fsSL "$gh/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kustomize
          curl -fsSL "$gh/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform
          curl -fsSL "$gh/kyverno/kyverno/releases/download/v${KYVERNO_VERSION}/kyverno-cli_v${KYVERNO_VERSION}_linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kyverno
          pipx install "yamllint==${YAMLLINT_VERSION}"
          kustomize version; kubeconform -v; kyverno version; yamllint --version; helm version --short

      - name: Lint
        run: make lint
