name: images

on:
  push:
    branches: [main]
    paths:
      - images/**
      - .github/workflows/images.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # keyless signing: the workflow's OIDC identity is the signer

env:
  IMAGE: ghcr.io/blacksoxx/ai-platform-reference/gpu-probe

jobs:
  gpu-probe:
    name: build, push and sign gpu-probe (linux/amd64, linux/arm64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v7.4.0
        with:
          context: images/gpu-probe
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - uses: sigstore/cosign-installer@v4.1.3

      - name: Sign the image digest (keyless, recorded in Rekor)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
