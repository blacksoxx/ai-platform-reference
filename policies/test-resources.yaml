# Resources for kyverno-test.yaml. team-a is a tenant namespace, platform is not.
apiVersion: v1
kind: Pod
metadata:
  name: compliant-pod
  namespace: team-a
  labels:
    app.kubernetes.io/name: probe
spec:
  containers:
    - name: probe
      image: ghcr.io/blacksoxx/ai-platform-reference/gpu-probe:main
---
apiVersion: v1
kind: Pod
metadata:
  name: privileged-pod
  namespace: team-a
  labels:
    app.kubernetes.io/name: probe
spec:
  containers:
    - name: probe
      image: ghcr.io/blacksoxx/ai-platform-reference/gpu-probe:main
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: unlabelled-pod
  namespace: team-a
spec:
  containers:
    - name: probe
      image: ghcr.io/blacksoxx/ai-platform-reference/gpu-probe:main
---
apiVersion: v1
kind: Pod
metadata:
  name: foreign-registry-pod
  namespace: team-a
  labels:
    app.kubernetes.io/name: web
spec:
  containers:
    - name: web
      image: docker.io/library/nginx:1.27
---
apiVersion: v1
kind: Pod
metadata:
  name: platform-namespace-pod
  namespace: platform
spec:
  containers:
    - name: agent
      image: docker.io/library/busybox:1.36
      securityContext:
        privileged: true
