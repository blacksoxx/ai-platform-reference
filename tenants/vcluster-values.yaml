# Values for the loft/vcluster chart shared by every tenant. Each tenant directory declares the
# chart with its own release name, so the control plane (a StatefulSet) runs inside the tenant's
# namespace and workloads created in the virtual cluster are synced into the same namespace,
# where the quota, the network policy and the admission policies apply to them.
# Chart: https://github.com/loft-sh/vcluster/tree/main/chart (0.37.6)
# Hybrid scheduling (sync.toHost.pods.hybridScheduling), which would hand synced Pods that name
# a host scheduler such as kai-scheduler to it, is a vCluster enterprise feature and stays off.
# Synced Pods are placed by the host's default scheduler; GPU work that must queue is deployed
# in the tenant namespace through the team's Argo CD project (docs/adr/0004, 0005).
sync:
  toHost:
    pods:
      # The /etc/hosts rewrite init container comes from mirror.gcr.io, which the registry policy
      # does not allow; it is only needed for Pod-hostname based DNS and stays off.
      rewriteHosts:
        enabled: false

controlPlane:
  statefulSet:
    pods:
      labels:
        # Required by policies/require-labels.yaml, which applies to this Pod too.
        app.kubernetes.io/name: vcluster
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
  serviceMonitor:
    enabled: true

# Quota, limits and network policy are owned by the tenant package, not by vCluster.
policies:
  resourceQuota:
    enabled: false
  limitRange:
    enabled: false
  networkPolicy:
    enabled: false
