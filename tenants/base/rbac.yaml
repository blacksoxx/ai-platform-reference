# The team's group administers its own namespace with the built-in "edit" ClusterRole, bound
# here only. No cluster-wide rights, no access to other tenants.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tenant-admins
  namespace: tenant
subjects:
  - kind: Group
    name: tenant
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: edit
  apiGroup: rbac.authorization.k8s.io
